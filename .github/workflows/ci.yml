# Verificação contínua do Voxa (docs/10-desenvolvimento.md §10.5).
# As Actions são fixadas pelo hash do commit (tags podem ser movidas);
# o comentário ao lado indica a versão correspondente.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Novas execuções do mesmo PR/branch cancelam as anteriores.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Sem telemetria do Turborepo nem avisos de atualização no CI.
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  verificacao:
    name: Lint, tipos, testes unitários e build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (lê packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache do Turborepo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  integracao:
    name: Testes de integração
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (lê packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mesma infraestrutura do desenvolvimento local (infra/compose).
      - name: Subir Postgres, Valkey, Garage, LiveKit e Mailpit
        run: pnpm dev:infra

      - name: Configurar variáveis de desenvolvimento
        run: cp .env.example .env

      # Falha (em vez de pular) se a infraestrutura não estiver disponível.
      - run: pnpm test:integration

      - name: Logs da infraestrutura (em caso de falha)
        if: failure()
        run: docker compose -f infra/compose/docker-compose.dev.yml logs --no-color --tail=200

  demonstracao:
    name: Demonstração da etapa (E2E e capturas)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (lê packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Chromium do Playwright (com as bibliotecas do sistema)
        run: pnpm --filter @voxa/web exec playwright install --with-deps chromium

      # .env de desenvolvimento, infraestrutura e migrações (o mesmo do Codespace).
      - run: pnpm bootstrap

      # Sobe o pnpm dev, roda os cenários E2E e gera demo/milestone-<N>/index.html.
      - run: pnpm demo
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Anexar a demonstração ao workflow
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demonstracao
          path: |
            demo/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 30
