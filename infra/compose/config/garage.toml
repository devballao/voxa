# Garage (S3) — configuração APENAS para desenvolvimento local.
# Os segredos abaixo são públicos e fixos de propósito; nunca use em produção.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "766f78612d6465762d7270632d7365637265742d6e616f2d7573652d656d2d70"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "voxa-dev-admin-token"
metrics_token = "voxa-dev-metrics-token"
