# LiveKit — configuração APENAS para desenvolvimento local.
# A chave e o segredo abaixo são públicos e fixos de propósito; nunca use em produção.
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  # Uma única porta UDP (multiplexada) facilita o mapeamento no Docker.
  udp_port: 7882
  # Candidato ICE anunciado ao navegador: o host, onde as portas estão publicadas.
  node_ip: 127.0.0.1
  use_external_ip: false
keys:
  voxa-dev-key: voxa-dev-secret-apenas-para-desenvolvimento-local
logging:
  level: info
